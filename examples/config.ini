# Copy to ~/.config/gq/config.ini (or run `gq setup`). See docs/CONFIG.md.
[gq]
refresh = 30
policy = half
auto_update = true
agents = false

[cluster bigiron]
host = bigiron              ; ~/.ssh/config alias with key login
account = auto
tokens = none

[cluster gpulab]
host = login.gpulab.example.org
account = mylab             ; I am in several accounts here
policy = max
partitions = gpu,debug
default.debug = cpus=2 mem=8G time=0:30:00
gpu_name.node07 = RTX6000
